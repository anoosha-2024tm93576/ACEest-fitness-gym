apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow-stable
  labels:
    app: aceest-fitness
    role: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: stable
    spec:
      containers:
        - name: aceest-fitness
          image: 2024tm93576anoosha/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000