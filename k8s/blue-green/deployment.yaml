# Blue Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-blue
  labels:
    app: aceest-fitness
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: blue
    spec:
      containers:
        -  name: aceest-fitness
           image: 2024tm93576anoosha/aceest-fitness:v3.2.4
           ports:
            - containerPort: 5000

---

